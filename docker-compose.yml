version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: orbitai-mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - orbitai-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: orbitai-redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - orbitai-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: orbitai-server
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3002
      MONGODB_URI: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017/orbitai?authSource=admin
      MONGO_USERNAME: ${MONGO_USERNAME:?MONGO_USERNAME is required}
      MONGO_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is required}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - "3002:3002"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - orbitai-network
    volumes:
      - ./server/uploads:/app/uploads

  # Frontend Client (for development/testing)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: orbitai-client
    restart: always
    environment:
      VITE_API_URL: http://localhost:3002
    ports:
      - "5173:80"
    depends_on:
      - server
    networks:
      - orbitai-network

volumes:
  mongodb_data:
  redis_data:

networks:
  orbitai-network:
    driver: bridge
