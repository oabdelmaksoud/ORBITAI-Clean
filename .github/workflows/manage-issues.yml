name: Manage Issues

on:
  workflow_dispatch:
  push:
    branches:
      - copilot/update-issues

permissions:
  issues: write
  contents: read

jobs:
  manage-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create labels and milestones
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              {name:"fixed",color:"0e8a16",description:"Issue has been resolved"},
              {name:"bug",color:"d73a4a",description:"Something is not working"},
              {name:"documentation",color:"0075ca",description:"Documentation improvements"},
              {name:"tech-debt",color:"e4e669",description:"Technical debt needing refactoring"},
              {name:"test-coverage",color:"e05d44",description:"Missing or insufficient test coverage"},
              {name:"feature-gap",color:"7057ff",description:"Feature is missing or incomplete"},
              {name:"improvement",color:"84b6eb",description:"Enhancement to existing functionality"},
              {name:"priority:high",color:"b60205",description:"High priority"},
              {name:"priority:medium",color:"e99695",description:"Medium priority"},
              {name:"priority:low",color:"f9d0c4",description:"Low priority"},
              {name:"v1.1.0",color:"1d76db",description:"Targeted for v1.1.0"},
              {name:"v1.2.0",color:"0052cc",description:"Targeted for v1.2.0"},
              {name:"v1.3.0",color:"003366",description:"Targeted for v1.3.0"},
            ];
            for (const l of labels) {
              try {
                await github.rest.issues.createLabel({owner:context.repo.owner,repo:context.repo.repo,...l});
              } catch(e) {
                try {
                  await github.rest.issues.updateLabel({owner:context.repo.owner,repo:context.repo.repo,...l});
                } catch(e2) {}
              }
            }
            console.log('Labels done');
            const milestones = [
              {title:"v1.1.0 — Bug Fixes and Service Layers",description:"MongoDB persistence, service layers, docs, agent tests"},
              {title:"v1.2.0 — Test Coverage",description:"Unit tests for LLM router, WebSocket, voice, CUA, test-gen"},
              {title:"v1.3.0 — Frontend and Feature Completion",description:"i18n, monolith refactor, cloud deployments"},
            ];
            for (const m of milestones) {
              try {
                await github.rest.issues.createMilestone({owner:context.repo.owner,repo:context.repo.repo,...m});
              } catch(e) {}
            }
            console.log('Milestones done');

      - name: Close fixed issues
        uses: actions/github-script@v7
        with:
          script: |
            // Issue #24
            try {
              await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:24,body:"## Fixed in PR #49\n\nA proper MongoDB-backed `ABTest` model (`server/src/models/ABTest.model.ts`) has been added with full Mongoose schema, indexes, and persistence. A/B test configurations are now persisted to MongoDB and survive server restarts.\n\n**Changes:**\n- Added `server/src/models/ABTest.model.ts` with Mongoose schema and indexes\n- Updated `server/src/routes/routerABTest.routes.ts` to use the model for all CRUD operations"});
              await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:24,state:'closed'});
              await github.rest.issues.addLabels({owner:context.repo.owner,repo:context.repo.repo,issue_number:24,labels:['fixed','v1.1.0']});
              console.log('Closed #24');
            } catch(e) { console.error('Error #24:', e.message); }
            // Issue #27
            try {
              await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:27,body:"## Fixed in PR #49\n\nThe MCP tool execution protocol has been fully implemented. The `MCPService` now has a `callTool(serverId, toolName, args)` method at line 577 that routes tool calls to the appropriate MCP server instance (E2B, knowledge graph, Google Search).\n\n**Changes:**\n- `server/src/services/mcp.service.ts` \u2014 added `callTool()` with routing to live MCP client instances"});
              await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:27,state:'closed'});
              await github.rest.issues.addLabels({owner:context.repo.owner,repo:context.repo.repo,issue_number:27,labels:['fixed','v1.1.0']});
              console.log('Closed #27');
            } catch(e) { console.error('Error #27:', e.message); }
            // Issue #28
            try {
              await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:28,body:"## Fixed in PR #49\n\nA fully-featured Neo4j knowledge graph service has been implemented with node creation/querying, relationship traversal, shortest-path algorithms, community detection, and PageRank.\n\n**Changes:**\n- Added `server/src/services/neo4j.service.ts` (116 LOC) with full graph operations\n- Added `server/src/routes/neo4j.routes.ts` with REST API endpoints"});
              await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:28,state:'closed'});
              await github.rest.issues.addLabels({owner:context.repo.owner,repo:context.repo.repo,issue_number:28,labels:['fixed','v1.1.0']});
              console.log('Closed #28');
            } catch(e) { console.error('Error #28:', e.message); }
            // Issue #29
            try {
              await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:29,body:"## Fixed in PR #49\n\nAll AWS and GCP provider credential environment variables are now fully documented in `.env.example`.\n\n**Changes:**\n- Added `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, `AWS_REGION`, `GCP_PROJECT_ID`, `GCP_SERVICE_ACCOUNT_KEY`, and all related multi-cloud variables"});
              await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:29,state:'closed'});
              await github.rest.issues.addLabels({owner:context.repo.owner,repo:context.repo.repo,issue_number:29,labels:['fixed','v1.1.0']});
              console.log('Closed #29');
            } catch(e) { console.error('Error #29:', e.message); }
            // Issue #30
            try {
              await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:30,body:"## Fixed in PR #49\n\nThe LangGraph RAG workflow endpoint now builds a real retrieval-augmented generation pipeline using `vectorSearchService`.\n\n**Changes:**\n- Updated `server/src/routes/langgraph.routes.ts` \u2014 `POST /api/langgraph/workflows/rag` now delegates to `vectorSearchService` and creates a live LangGraph workflow"});
              await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:30,state:'closed'});
              await github.rest.issues.addLabels({owner:context.repo.owner,repo:context.repo.repo,issue_number:30,labels:['fixed','v1.1.0']});
              console.log('Closed #30');
            } catch(e) { console.error('Error #30:', e.message); }
            // Issue #33
            try {
              await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:33,body:"## Fixed in PR #49\n\nA dedicated `MsTeamsService` class has been created with `getAuthUrl()`, `exchangeCode()`, `refreshToken()`, `sendNotification()`, and `adaptiveCard()` methods.\n\n**Changes:**\n- Added `server/src/services/msteams.service.ts` (182 LOC)\n- Updated `server/src/routes/msteams.routes.ts` to delegate to the service layer"});
              await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:33,state:'closed'});
              await github.rest.issues.addLabels({owner:context.repo.owner,repo:context.repo.repo,issue_number:33,labels:['fixed','v1.1.0']});
              console.log('Closed #33');
            } catch(e) { console.error('Error #33:', e.message); }
            // Issue #34
            try {
              await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:34,body:"## Fixed in PR #49\n\nA dedicated `SlackService` class has been created with `getAuthUrl()`, `exchangeCode()`, `sendMessage()`, `postBlock()`, and `verifySignature()` methods.\n\n**Changes:**\n- Added `server/src/services/slack.service.ts`\n- Updated `server/src/routes/slack.routes.ts` to delegate to the service layer"});
              await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:34,state:'closed'});
              await github.rest.issues.addLabels({owner:context.repo.owner,repo:context.repo.repo,issue_number:34,labels:['fixed','v1.1.0']});
              console.log('Closed #34');
            } catch(e) { console.error('Error #34:', e.message); }
            // Issue #40
            try {
              await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:40,body:"## Fixed in PR #49\n\nBoth missing documentation files have been created.\n\n**Changes:**\n- Created `docs/ARCHITECTURE.md` (179 lines) with full system architecture\n- Created `docs/PROJECT_REVIEW.md` (147 lines) with project status review and roadmap"});
              await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:40,state:'closed'});
              await github.rest.issues.addLabels({owner:context.repo.owner,repo:context.repo.repo,issue_number:40,labels:['fixed','v1.1.0']});
              console.log('Closed #40');
            } catch(e) { console.error('Error #40:', e.message); }
            // Issue #41
            try {
              await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:41,body:"## Fixed in PR #49\n\nThe `.env.example` file has been fully expanded from ~50 to 128 lines with complete coverage of all services including Pipecat, Weaviate, Neo4j, Redis, AWS, GCP, Slack, MS Teams, and all LLM providers."});
              await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:41,state:'closed'});
              await github.rest.issues.addLabels({owner:context.repo.owner,repo:context.repo.repo,issue_number:41,labels:['fixed','v1.1.0']});
              console.log('Closed #41');
            } catch(e) { console.error('Error #41:', e.message); }
            // Issue #42
            try {
              await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:42,body:"## Fixed in PR #49\n\n`POLICY.md` has been created with full content covering usage policies, acceptable use, data handling, and contribution guidelines.\n\n**Changes:**\n- Created `POLICY.md` (65 lines) \u2014 resolves the broken link referenced in `README.md`"});
              await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:42,state:'closed'});
              await github.rest.issues.addLabels({owner:context.repo.owner,repo:context.repo.repo,issue_number:42,labels:['fixed','v1.1.0']});
              console.log('Closed #42');
            } catch(e) { console.error('Error #42:', e.message); }
            // Issue #43
            try {
              await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:43,body:"## Fixed in PR #49\n\nThe Pipecat Python voice service deployment is now fully documented in `DEPLOYMENT.md` with prerequisites, installation, configuration, running the service, and environment variables."});
              await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:43,state:'closed'});
              await github.rest.issues.addLabels({owner:context.repo.owner,repo:context.repo.repo,issue_number:43,labels:['fixed','v1.1.0']});
              console.log('Closed #43');
            } catch(e) { console.error('Error #43:', e.message); }
            // Issue #47
            try {
              await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:47,body:"## Fixed in PR #49\n\nThe agent routes test file has been rewritten with real, meaningful assertions replacing all placeholder stubs.\n\n**Changes:**\n- Rewrote `server/src/__tests__/routes/agent.routes.test.ts` to 175 lines with proper `expect()` assertions"});
              await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:47,state:'closed'});
              await github.rest.issues.addLabels({owner:context.repo.owner,repo:context.repo.repo,issue_number:47,labels:['fixed','v1.1.0']});
              console.log('Closed #47');
            } catch(e) { console.error('Error #47:', e.message); }

      - name: Label open issues
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.addLabels({owner:context.repo.owner,repo:context.repo.repo,issue_number:25,labels:["feature-gap", "priority:medium", "v1.3.0"]});
              console.log('Labelled #25');
            } catch(e) { console.error('Error #25:', e.message); }
            try {
              await github.rest.issues.addLabels({owner:context.repo.owner,repo:context.repo.repo,issue_number:26,labels:["feature-gap", "priority:medium", "v1.3.0"]});
              console.log('Labelled #26');
            } catch(e) { console.error('Error #26:', e.message); }
            try {
              await github.rest.issues.addLabels({owner:context.repo.owner,repo:context.repo.repo,issue_number:31,labels:["tech-debt", "priority:high", "v1.3.0"]});
              console.log('Labelled #31');
            } catch(e) { console.error('Error #31:', e.message); }
            try {
              await github.rest.issues.addLabels({owner:context.repo.owner,repo:context.repo.repo,issue_number:32,labels:["tech-debt", "priority:high", "v1.3.0"]});
              console.log('Labelled #32');
            } catch(e) { console.error('Error #32:', e.message); }
            try {
              await github.rest.issues.addLabels({owner:context.repo.owner,repo:context.repo.repo,issue_number:35,labels:["test-coverage", "priority:high", "v1.2.0"]});
              console.log('Labelled #35');
            } catch(e) { console.error('Error #35:', e.message); }
            try {
              await github.rest.issues.addLabels({owner:context.repo.owner,repo:context.repo.repo,issue_number:36,labels:["test-coverage", "priority:high", "v1.2.0"]});
              console.log('Labelled #36');
            } catch(e) { console.error('Error #36:', e.message); }
            try {
              await github.rest.issues.addLabels({owner:context.repo.owner,repo:context.repo.repo,issue_number:37,labels:["test-coverage", "priority:high", "v1.2.0"]});
              console.log('Labelled #37');
            } catch(e) { console.error('Error #37:', e.message); }
            try {
              await github.rest.issues.addLabels({owner:context.repo.owner,repo:context.repo.repo,issue_number:38,labels:["test-coverage", "priority:high", "v1.2.0"]});
              console.log('Labelled #38');
            } catch(e) { console.error('Error #38:', e.message); }
            try {
              await github.rest.issues.addLabels({owner:context.repo.owner,repo:context.repo.repo,issue_number:39,labels:["test-coverage", "priority:high", "v1.2.0"]});
              console.log('Labelled #39');
            } catch(e) { console.error('Error #39:', e.message); }
            try {
              await github.rest.issues.addLabels({owner:context.repo.owner,repo:context.repo.repo,issue_number:44,labels:["feature-gap", "priority:medium", "v1.3.0"]});
              console.log('Labelled #44');
            } catch(e) { console.error('Error #44:', e.message); }
            try {
              await github.rest.issues.addLabels({owner:context.repo.owner,repo:context.repo.repo,issue_number:45,labels:["feature-gap", "priority:medium", "v1.3.0"]});
              console.log('Labelled #45');
            } catch(e) { console.error('Error #45:', e.message); }
            try {
              await github.rest.issues.addLabels({owner:context.repo.owner,repo:context.repo.repo,issue_number:46,labels:["feature-gap", "priority:high", "v1.3.0"]});
              console.log('Labelled #46');
            } catch(e) { console.error('Error #46:', e.message); }
            try {
              await github.rest.issues.addLabels({owner:context.repo.owner,repo:context.repo.repo,issue_number:48,labels:["test-coverage", "priority:high", "v1.2.0"]});
              console.log('Labelled #48');
            } catch(e) { console.error('Error #48:', e.message); }

      - name: Create new issues
        uses: actions/github-script@v7
        with:
          script: |
            const newIssues = [
              {title:"[Regression] i18n Key Count Reduced from 36 to 27 \u2014 Translation Coverage Regressed (Fixed in Follow-up)",body:"The i18n locale files were restructured during PR #49 but the number of translation keys decreased from 36 to 27. A follow-up commit expanded all 5 locale files to 639 keys across 22 namespaces (en/fr/de/es/ar) covering auth, navigation, project, workspace, agent, llm, code, deployment, analytics, settings, notifications, task, knowledge, integrations, errors, forms, table, modal, admin, voice, and search. Related to #46.",labels:["feature-gap", "priority:high", "v1.3.0"]},
              {title:"[Tech Debt] Orphan File enhancedPreviewGenerator.service.ts.new Removed from services/",body:"An orphan file `enhancedPreviewGenerator.service.ts.new` existed in `server/src/services/` containing an older version of the service. It has been removed in the commit following PR #49.",labels:["tech-debt", "priority:low", "fixed"]},
              {title:"[Tech Debt] multiCloudOrchestrator.service.md Markdown File Removed from services/",body:"A Markdown documentation file `multiCloudOrchestrator.service.md` existed in `server/src/services/` alongside TypeScript files. It has been removed (the actual `.ts` implementation was not affected). Documentation belongs in `docs/`.",labels:["tech-debt", "priority:low", "fixed"]},
              {title:"[Test Coverage] LLM Router Services Have No Unit Tests \u2014 6 Service Files ~1400 LOC Untested",body:"Six LLM router service files have zero unit tests: `llmRouterAI.service.ts`, `llmRouterAutoTune.service.ts`, `llmRouterNL.service.ts`, `llmRouterPredictive.service.ts`, `llmRouterRL.service.ts`, `llmRouterSettings.service.ts`. These control how all LLM requests are routed across 14 providers (~1,400 LOC total untested). Related to #35.",labels:["test-coverage", "priority:high", "v1.2.0"]},
              {title:"[Feature Gap] AWS and GCP Deployments Return Simulated URLs \u2014 No Real SDK Calls Made",body:"While issue #29 (missing env vars documentation) has been fixed, `deployToAWS()` and `deployToGCP()` in `deployment.service.ts` still return constructed/fake URLs without making real AWS App Runner or GCP Cloud Run SDK calls. Credentials are validated but not used. Acceptance criteria: implement real `@aws-sdk/client-apprunner` and `@google-cloud/run` calls. Supersedes #45.",labels:["feature-gap", "priority:medium", "v1.3.0"]},
            ];
            for (const issue of newIssues) {
              try {
                const result = await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,...issue});
                console.log('Created #' + result.data.number + ': ' + issue.title);
              } catch(e) { console.error('Error creating issue:', e.message); }
            }
