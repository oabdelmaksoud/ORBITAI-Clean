<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#orbitGrad)"/>
  <!-- Orbit Ring -->
  <ellipse cx="256" cy="256" rx="180" ry="60" fill="none" stroke="white" stroke-width="12" opacity="0.6" transform="rotate(-20 256 256)"/>
  <!-- Center Circle (Planet) -->
  <circle cx="256" cy="256" r="80" fill="white"/>
  <!-- AI Dot -->
  <circle cx="256" cy="256" r="40" fill="url(#orbitGrad)"/>
  <!-- Orbiting Satellite -->
  <circle cx="420" cy="200" r="24" fill="white"/>
</svg>
