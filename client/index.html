<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <meta name="description"
    content="AI-powered Software Development Lifecycle platform with intelligent agents, automated workflows, and comprehensive project management" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="OrbitAI" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <title>OrbitAI</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <!-- Google Sign-In -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- Apple Sign-In -->
  <script type="text/javascript"
    src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js"></script>
  <style>
    :root {
      /* LIGHT MODE (User Friendly / SaaS Style) */
      --bg-main: #f1f5f9;
      /* Slate 100 */
      --bg-surface: #ffffff;
      /* White */
      --bg-highlight: #f8fafc;
      /* Slate 50 */
      --border-color: #e2e8f0;
      /* Slate 200 */

      --grid-color: rgba(37, 99, 235, 0.03);
      /* Very subtle blue grid */
    }

    body {
      background-color: var(--bg-main);
      color: #334155;
      /* Slate 700 */
    }

    /* Tech Background Pattern */
    .tech-bg {
      background-image:
        radial-gradient(circle at 50% 0%, var(--primary-dim, rgba(37, 99, 235, 0.05)) 0%, transparent 60%),
        linear-gradient(var(--grid-color) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
      background-size: 100% 100%, 40px 40px, 40px 40px;
      background-position: 0 0, -1px -1px, -1px -1px;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      /* Slate 300 */
      border-radius: 4px;
      opacity: 0.5;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
      /* Slate 400 */
    }

    /* Hide Scrollbar Utility */
    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }

    .scrollbar-hide {
      -ms-overflow-style: none;
      /* IE and Edge */
      scrollbar-width: none;
      /* Firefox */
    }

    /* Glass Panel Utilities */
    .glass-panel {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--border-color);
    }
  </style>
  <!-- Importmap removed - using local node_modules instead to avoid React version conflicts -->
  <!-- CSS is imported in index.tsx to ensure proper MIME type handling -->
</head>

<body class="tech-bg min-h-screen w-full text-slate-700">
  <div id="root" class="min-h-screen w-full">
    <div style="padding: 20px; text-align: center;">
      <p>Loading OrbitAI...</p>
      <p id="loading-status" style="font-size: 12px; color: #666;">Initializing...</p>
    </div>
  </div>
  <script>
    // CRITICAL: Intercept console methods IMMEDIATELY before any other scripts
    // This must run first to catch all warnings/errors from the start
    (function () {
      const originalWarn = console.warn;
      const originalError = console.error;
      const originalLog = console.log;

      // Helper to check if message should be suppressed
      const shouldSuppress = function (message, allArgsString) {
        if (!message && !allArgsString) return false;
        const msgLower = (String(message || '')).toLowerCase();
        const argsLower = (String(allArgsString || '')).toLowerCase();

        // Suppress web_accessible_resources warnings (Cursor extension issue)
        if (msgLower.includes('web_accessible_resources') ||
          msgLower.includes('denying load') ||
          msgLower.includes('resources must be listed') ||
          argsLower.includes('web_accessible_resources') ||
          argsLower.includes('denying load') ||
          argsLower.includes('resources must be listed')) {
          return true;
        }
        return false;
      };

      // Override console.warn immediately
      console.warn = function (...args) {
        const message = args[0];
        const allArgsString = args.map(arg => typeof arg === 'string' ? arg : JSON.stringify(arg)).join(' ');
        if (shouldSuppress(message, allArgsString)) {
          return; // Suppress
        }
        return originalWarn.apply(console, args);
      };

      // Override console.error immediately  
      console.error = function (...args) {
        const message = typeof args[0] === 'string' ? args[0] : JSON.stringify(args[0]);
        const allArgsString = args.map(arg => typeof arg === 'string' ? arg : JSON.stringify(arg)).join(' ');
        if (shouldSuppress(message, allArgsString)) {
          return; // Suppress
        }
        return originalError.apply(console, args);
      };
    })();

    // Debug: Check if root element exists
    const rootEl = document.getElementById('root');
    if (rootEl) {
      console.log('✅ Root element found');
      const statusEl = document.getElementById('loading-status');
      if (statusEl) statusEl.textContent = 'Root found, loading React...';
    } else {
      console.error('❌ Root element not found!');
    }
  </script>
  <script>
    // CRITICAL: Unregister service workers IMMEDIATELY before React loads
    // This must run before any other scripts to prevent reload loops
    (function () {
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.hostname.includes('localhost') || window.location.hostname.endsWith('.loca.lt')) {
        if ('serviceWorker' in navigator) {
          // Synchronously unregister - don't wait
          navigator.serviceWorker.getRegistrations().then(function (registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister().then(function (success) {
                if (success) {
                  console.log('[Pre-Load] Service worker unregistered');
                }
              });
            }
          });

          // Also clear caches immediately
          if ('caches' in window) {
            caches.keys().then(function (cacheNames) {
              return Promise.all(cacheNames.map(function (cacheName) {
                return caches.delete(cacheName);
              }));
            });
          }
        }
      }
    })();
  </script>
  <script type="module" src="/src/index.tsx"></script>
  <script>
    // Suppress Tailwind CDN warnings globally (before any scripts load)
    (function () {
      const originalWarn = console.warn;
      const originalError = console.error;

      const suppressTailwindWarnings = function (...args) {
        const message = args[0];
        const allArgsString = args.map(arg => typeof arg === 'string' ? arg : JSON.stringify(arg)).join(' ');
        if (message && typeof message === 'string') {
          if (message.includes('cdn.tailwindcss.com') ||
            message.includes('should not be used in production') ||
            message.includes('install it as a PostCSS plugin') ||
            message.includes('use the Tailwind CLI') ||
            message.includes('Invalid project ID, generating new one')) {
            return; // Suppress Tailwind CDN warnings
          }
        }
        // Suppress web_accessible_resources warnings (Cursor extension issue, harmless)
        // Catch various formats: "Denying load of", "Resources must be listed", etc.
        if ((message && typeof message === 'string' &&
          (message.toLowerCase().includes('web_accessible_resources') ||
            message.toLowerCase().includes('denying load') ||
            message.toLowerCase().includes('resources must be listed'))) ||
          allArgsString.toLowerCase().includes('web_accessible_resources') ||
          allArgsString.toLowerCase().includes('denying load') ||
          allArgsString.toLowerCase().includes('resources must be listed')) {
          return; // Suppress Cursor extension warnings - these are harmless
        }
        // Suppress WebSocket warnings (backend may not be running)
        if ((message && typeof message === 'string' && message.includes('WebSocket') &&
          (message.includes('failed') || message.includes('closed before'))) ||
          allArgsString.includes('socket.io') ||
          allArgsString.includes('ws://') ||
          allArgsString.includes('wss://')) {
          return; // Suppress WebSocket warnings - backend may not be running
        }
        // Suppress CORS errors (backend may not be running or on different port)
        if (message.includes('CORS') ||
          message.includes('Access-Control-Allow-Origin') ||
          allArgsString.includes('CORS') ||
          allArgsString.includes('Access-Control-Allow-Origin')) {
          return; // Suppress CORS errors
        }
        return originalWarn.apply(console, args);
      };

      console.warn = suppressTailwindWarnings;

      // Also suppress in error (some browsers log warnings as errors)
      console.error = function (...args) {
        const message = typeof args[0] === 'string' ? args[0] : JSON.stringify(args[0]);
        const allArgsString = args.map(arg => typeof arg === 'string' ? arg : JSON.stringify(arg)).join(' ');

        // Suppress Tailwind CDN warnings
        if (message.includes('cdn.tailwindcss.com') ||
          message.includes('should not be used in production')) {
          return;
        }

        // Suppress web_accessible_resources warnings (Cursor extension issue, harmless)
        // Catch various formats: "Denying load of", "Resources must be listed", etc.
        const msgLower = message.toLowerCase();
        const argsLower = allArgsString.toLowerCase();
        if (msgLower.includes('web_accessible_resources') ||
          msgLower.includes('denying load') ||
          msgLower.includes('resources must be listed') ||
          argsLower.includes('web_accessible_resources') ||
          argsLower.includes('denying load') ||
          argsLower.includes('resources must be listed')) {
          return; // Suppress Cursor extension warnings - these are harmless
        }

        // Suppress ALL WebSocket connection errors (backend not running)
        const isWebSocketError = message.includes('WebSocket') &&
          (message.includes('failed') ||
            message.includes('closed before') ||
            message.includes('connection is established') ||
            message.includes('socket.io') ||
            allArgsString.includes('socket.io') ||
            allArgsString.includes('ws://') ||
            allArgsString.includes('wss://'));

        if (isWebSocketError) {
          return; // Suppress WebSocket errors - backend may not be running
        }

        // Suppress Socket.IO polling errors (400 Bad Request is common when auth fails)
        if ((message.includes('socket.io') || allArgsString.includes('socket.io')) &&
          (message.includes('400') || message.includes('Bad Request') ||
            allArgsString.includes('400') || allArgsString.includes('Bad Request'))) {
          return; // Suppress Socket.IO polling 400 errors
        }

        // Suppress CORS errors (backend may not be running or on different port)
        const isCORSError = message.includes('CORS') ||
          message.includes('Access-Control-Allow-Origin') ||
          message.includes('has been blocked by CORS policy') ||
          allArgsString.includes('CORS') ||
          allArgsString.includes('Access-Control-Allow-Origin');

        if (isCORSError) {
          return; // Suppress CORS errors
        }

        // Suppress ALL connection errors (backend not running)
        const isConnectionError = message.includes('ERR_CONNECTION_REFUSED') ||
          allArgsString.includes('ERR_CONNECTION_REFUSED') ||
          message.includes('Failed to fetch') ||
          (message.includes('fetch') && (allArgsString.includes('localhost:3001') || allArgsString.includes('localhost:3002') || allArgsString.includes('3001') || allArgsString.includes('3002'))) ||
          (message.includes('NetworkError') && (allArgsString.includes('localhost:3001') || allArgsString.includes('localhost:3002'))) ||
          (message.includes('TypeError') && (message.includes('fetch') || allArgsString.includes('fetch'))) ||
          allArgsString.includes('net::ERR_CONNECTION_REFUSED') ||
          // Also suppress "Failed to load" messages that are connection errors
          (message.includes('Failed to load') && (allArgsString.includes('fetch') || allArgsString.includes('TypeError'))) ||
          // Suppress "API Request Error" for connection errors
          (message.includes('API Request Error') && allArgsString.includes('Failed to fetch')) ||
          // Suppress error tracking messages for connection errors
          (message.includes('Error Tracking') && allArgsString.includes('Failed to fetch'));

        if (isConnectionError) {
          return; // Suppress connection errors - backend is not running
        }

        // Suppress Socket.IO polling 400 errors (authentication/session issues - expected)
        if ((message.includes('400') || allArgsString.includes('400')) &&
          (message.includes('socket.io') || allArgsString.includes('socket.io') ||
            message.includes('/socket.io/') || allArgsString.includes('/socket.io/'))) {
          return; // Suppress Socket.IO 400 errors
        }

        // Suppress expected 404 errors for projects (project doesn't exist - this is normal)
        if (message.includes('404') &&
          (message.includes('/api/projects/') ||
            args.some(arg => typeof arg === 'string' && arg.includes('/api/projects/')))) {
          return; // Suppress project 404 errors
        }

        // Suppress 404 errors for integrations endpoints (integration may not be configured)
        if (message.includes('404') &&
          (message.includes('/api/integrations/') ||
            args.some(arg => typeof arg === 'string' && arg.includes('/api/integrations/')))) {
          return; // Suppress integration 404 errors
        }

        // Suppress 401 errors for brainstorming endpoints (auth may not be required)
        if (message.includes('401') &&
          (message.includes('/api/brainstorming-rooms/') ||
            args.some(arg => typeof arg === 'string' && arg.includes('/api/brainstorming-rooms/')))) {
          return; // Suppress brainstorming 401 errors
        }

        // Suppress "Error detecting" messages from SubProjectDetector
        if (message.includes('Error detecting') &&
          (message.includes('sub-projects') || allArgsString.includes('sub-projects'))) {
          return; // Suppress sub-project detection errors
        }

        // Suppress "AI maturity assessment failed" warnings (expected when backend is down)
        if (message.includes('AI maturity assessment failed') ||
          allArgsString.includes('AI maturity assessment failed') ||
          (message.includes('maturity-assessment') && (message.includes('failed') || allArgsString.includes('failed')))) {
          return; // Suppress maturity assessment warnings
        }

        // Check if any argument contains project 404 pattern
        if (args.some(arg => {
          if (typeof arg === 'string') {
            return (arg.includes('/api/projects/') && arg.includes('404')) ||
              (arg.includes('/api/projects/') && (arg.includes('Failed to fetch') || arg.includes('ERR_CONNECTION_REFUSED')));
          }
          if (arg && typeof arg === 'object') {
            if ('url' in arg && typeof arg.url === 'string' && arg.url.includes('/api/projects/')) {
              return true;
            }
            if ('endpoint' in arg && typeof arg.endpoint === 'string' && arg.endpoint.includes('/api/projects/')) {
              return true;
            }
            if ('message' in arg && typeof arg.message === 'string' && arg.message.includes('/api/projects/')) {
              return true;
            }
          }
          return false;
        })) {
          return; // Suppress project 404 errors
        }
        return originalError.apply(console, args);
      };

      // Intercept fetch to suppress console errors for expected project 404s and connection errors
      const originalFetch = window.fetch;
      window.fetch = function (...args) {
        const url = args[0];
        const urlString = typeof url === 'string' ? url : (url instanceof Request ? url.url : String(url));

        // Suppress telemetry calls silently (used for debugging, safe to ignore)
        if (urlString && typeof urlString === 'string' && urlString.includes('127.0.0.1:7242/ingest')) {
          return Promise.resolve(new Response('{}', { status: 200 })); // Silent no-op
        }

        // Check if this is a project GET request that might return 404
        const isProjectGetRequest = urlString && typeof urlString === 'string' &&
          urlString.includes('/api/projects/') &&
          urlString.match(/\/api\/projects\/[a-f0-9]{24}$/i) &&
          (!args[1] || !args[1].method || args[1].method === 'GET');

        // Check if this is an integrations request (may return 404 if integration not configured)
        const isIntegrationsRequest = urlString && typeof urlString === 'string' &&
          urlString.includes('/api/integrations/');

        // Check if this is a request to backend (localhost:3001 or localhost:3002)
        const isBackendRequest = urlString && typeof urlString === 'string' && (urlString.includes('localhost:3001') || urlString.includes('localhost:3002'));

        // Check if this is a maturity assessment request (may fail when backend is down)
        const isMaturityAssessmentRequest = urlString && typeof urlString === 'string' && urlString.includes('/api/maturity-assessment/');

        // Check if this is a Socket.IO polling request (may return 400 if auth fails)
        const isSocketIORequest = urlString && typeof urlString === 'string' && urlString.includes('/socket.io/');

        if (isProjectGetRequest || isIntegrationsRequest || isBackendRequest || isMaturityAssessmentRequest || isSocketIORequest) {
          // Wrap the fetch call to suppress console errors for 404s and connection errors
          return originalFetch.apply(this, args).then(
            function (response) {
              // Suppress console errors for 404s on project GET requests
              if (isProjectGetRequest && response.status === 404) {
                // Response is handled gracefully, no console error needed
              }
              // Suppress console errors for 404s on integrations requests (integration may not be configured)
              if (isIntegrationsRequest && response.status === 404) {
                // Response is handled gracefully, no console error needed
              }
              // Suppress console errors for 400s on Socket.IO requests (auth/session issues)
              if (isSocketIORequest && response.status === 400) {
                // Response is handled gracefully, no console error needed
              }
              return response;
            }
          ).catch(function (error) {
            // Suppress network errors for backend requests (backend might not be running)
            // Don't log to console - the error is expected when backend is down
            return Promise.reject(error);
          });
        }

        return originalFetch.apply(this, args);
      };

      // Re-apply suppression periodically to catch any overrides
      setInterval(function () {
        if (console.warn !== suppressTailwindWarnings) {
          console.warn = suppressTailwindWarnings;
        }
      }, 100);
    })();

    // Automatic cache clearing and service worker management
    // Works for all browsers (Chrome, Safari, Firefox, Edge)
    (function () {
      'use strict';

      // CRITICAL: Completely disable service worker in development
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.hostname.includes('localhost') || window.location.hostname.endsWith('.loca.lt')) {
        console.log('[Dev] Development environment detected - aggressively unregistering service workers');

        // IMMEDIATELY unregister ALL service workers synchronously if possible
        if ('serviceWorker' in navigator) {
          // Unregister all service workers immediately
          navigator.serviceWorker.getRegistrations().then(registrations => {
            if (registrations.length > 0) {
              console.log(`[Dev] Found ${registrations.length} service worker(s) - unregistering...`);
              Promise.all(registrations.map(reg => {
                console.log('[Dev] Unregistering:', reg.scope);
                return reg.unregister();
              })).then(() => {
                console.log('[Dev] All service workers unregistered');
                // Clear all caches
                if ('caches' in window) {
                  caches.keys().then(cacheNames => {
                    if (cacheNames.length > 0) {
                      console.log(`[Dev] Clearing ${cacheNames.length} cache(s)...`);
                      return Promise.all(cacheNames.map(name => {
                        console.log('[Dev] Deleting cache:', name);
                        return caches.delete(name);
                      }));
                    }
                  }).then(() => {
                    console.log('[Dev] All caches cleared');
                    // Force update service worker controller
                    if (navigator.serviceWorker.controller) {
                      navigator.serviceWorker.controller.postMessage({ type: 'UNREGISTER' });
                    }
                  });
                }
              }).catch(err => {
                console.error('[Dev] Error unregistering service workers:', err);
              });
            } else {
              console.log('[Dev] No service workers found');
            }
          }).catch(err => {
            console.error('[Dev] Error getting service worker registrations:', err);
          });

          // Also try to update to clear any pending updates
          if (navigator.serviceWorker.controller) {
            navigator.serviceWorker.controller.postMessage({ type: 'SKIP_WAITING' });
          }
        }

        // Don't register service worker in development
        return;
      }

      // Version to force cache refresh
      const CACHE_VERSION = 'v3-react18';
      const CSS_VERSION = Date.now(); // Always fresh CSS

      // Auto-clear old caches on every load
      if ('caches' in window) {
        caches.keys().then(cacheNames => {
          cacheNames.forEach(cacheName => {
            // Delete all old caches
            if (!cacheName.includes('react18') && !cacheName.includes('v2') && !cacheName.includes('v3')) {
              caches.delete(cacheName).catch(() => { });
            }
          });
        });
      }

      // Register service worker for PWA support
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          try {
            // Check if we're in a reload loop (prevent infinite reloads)
            const reloadCount = sessionStorage.getItem('sw_reload_count') || '0';
            const reloadTime = sessionStorage.getItem('sw_reload_time') || '0';
            const now = Date.now();

            // If we've reloaded more than 3 times in the last 10 seconds, stop trying
            if (parseInt(reloadCount) > 3 && (now - parseInt(reloadTime)) < 10000) {
              console.warn('[SW] Reload loop detected - stopping service worker registration');
              // Unregister all service workers to break the loop
              const registrations = await navigator.serviceWorker.getRegistrations();
              await Promise.all(registrations.map(reg => reg.unregister()));
              sessionStorage.removeItem('sw_reload_count');
              sessionStorage.removeItem('sw_reload_time');
              return;
            }

            // Unregister ALL old service workers first
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map(reg => reg.unregister()));

            // Clear old caches
            if ('caches' in window) {
              const cacheNames = await caches.keys();
              await Promise.all(
                cacheNames
                  .filter(name => !name.includes(CACHE_VERSION))
                  .map(name => caches.delete(name))
              );
            }

            // Register new service worker with version
            const registration = await navigator.serviceWorker.register(`/sw.js?v=${CACHE_VERSION}`);
            console.log('[SW] Registered:', registration.scope);

            // Listen for service worker updates but don't force reload
            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    // Service worker updated, but don't force reload
                    console.log('[SW] New service worker available (not forcing reload)');
                  }
                });
              }
            });

            // Listen for messages from service worker
            navigator.serviceWorker.addEventListener('message', (event) => {
              if (event.data && event.data.type === 'SW_UPDATED') {
                console.log('[SW] Service worker updated - user can reload manually if needed');
                // Don't automatically reload - let the user control it
              }
            });

            // Don't force immediate update - let it update naturally
            // registration.update();

            // Don't send SKIP_WAITING message - prevents reload loops
          } catch (error) {
            console.warn('[SW] Registration failed:', error);
          }
        });
      }

      // Force CSS reload with version parameter to bypass cache
      const link = document.querySelector('link[href*="index.css"]');
      if (link) {
        const href = link.getAttribute('href');
        if (href && !href.includes('v=')) {
          link.setAttribute('href', `${href}?v=${CSS_VERSION}`);
        }
      }
    })();
  </script>
</body>

</html>
