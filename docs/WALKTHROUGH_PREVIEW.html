**OrbitAI** is an AI-native software development platform that transforms unstructured ideas into structured, executable project plans. It combines real-time brainstorming, intelligent LLM routing, and autonomous agent orchestration to accelerate the software development lifecycle.

### 1.1 Vision & Purpose

OrbitAI addresses a fundamental challenge in software development: **the gap between ideation and execution**. Traditional tools require developers to manually translate ideas into requirements, architecture, and code. OrbitAI automates this transformation through:

- **Conversational Requirements Gathering**: Users describe their vision in natural language, and AI extracts structured requirements, features, and constraints.
- **Intelligent Prototyping**: From a conversation, OrbitAI generates interactive wireframes, system architecture diagrams, and technology recommendations.
- **Autonomous Execution**: Once approved, specialized AI agents work through a structured methodology (V-Model, Agile, etc.) to produce actual artifacts—requirements documents, design specs, test plans, and code.

### 1.2 Core Features

| Feature | Description |
|---------|-------------|
| **Neural Stream Chat** | Real-time AI-assisted brainstorming interface with streaming responses. Automatically extracts ideas, categorizes them (features, risks, constraints), and visualizes them as an interactive mind map. |
| **Multi-View Visualization** | Display ideas as Bubbles (force-directed graph), Tree (hierarchical), Mind Map (radial), or Research (card layout). |
| **Prototype Generation** | One-click generation of HTML/Tailwind wireframes, Mermaid.js architecture diagrams, and recommended tech stacks based on the conversation context. |
| **Multi-LLM Router** | Backend service that intelligently routes prompts to Gemini (speed/cost), OpenAI (code generation), or Claude (deep reasoning) based on task requirements. Supports **14 providers**. |
| **Agent Orchestration** | Autonomous AI agents assigned to specific roles (Requirements Agent, UX Designer, QA Auditor, etc.) that collaborate to complete tasks with quality gates. |
| **V-Model Methodology** | Built-in support for structured SDLC phases: Initiation → Requirements → Architecture → Test Planning → Implementation → Integration → Release. |
| **Computer Use Agent (CUA)** | Dual implementation: Node.js Playwright for browser testing + Python LiteLLM for OS-level control. |
| **Project Persistence** | Dual-layer storage with MongoDB backend and localStorage fallback for offline-first experience. |
| **Compliance Standards** | Built-in support for ISO 26262 (automotive), GDPR, SOC 2, and custom quality standards. |
| **Real-time Updates** | WebSocket-powered updates for live progress tracking and streaming AI responses. |

## 7. LLM Router Architecture

**Location:** [server/src/services/llm/LLMRouter.ts](file:///Users/omarabdelmaksoud/OrbitAI/ORBITAI-Clean/server/src/services/llm/LLMRouter.ts) (1,430 lines)

### Architecture Pattern: Strategy + Fallback Chain

```mermaid
flowchart TD
    A[executeWithFallback] --> B{Model Specified?}
    B -->|Yes| C[executeWithSpecificModel]
    B -->|No| D[Analyze Task]
    D --> E[taskAnalyzer.analyzeTask]
    E --> F[routingEngine.selectModel]
    F --> G{User Has Local Models?}
    G -->|Yes| H[Prefer Local Model]
    G -->|No| I[Use Cloud Model]
    H --> J[Check Cache]
    I --> J
    J -->|Hit| K[Return Cached]
    J -->|Miss| L[Execute with Provider]
    L --> M{Rate Limited?}
    M -->|Yes| N[Exponential Backoff]
    N --> O{Retry < 3?}
    O -->|Yes| L
    O -->|No| P[Fallback or Throw]
    M -->|No| Q[Track Usage]
    Q --> R{Has Function Calls?}
    R -->|Yes| S[Process Function Calls]
    R -->|No| T[Return Response]
    S --> T
```

## 9.1 User Journey Logic Analysis

> [!IMPORTANT]
> This section documents identified issues in the user journey flow, covering view transitions, state management, and edge cases that require attention.

### View Mode State Machine

**Primary ViewMode States:**
```typescript
type ViewMode = 'landing' | 'hub' | 'setup' | 'workspace' | 'admin' | 'shared';
```

```mermaid
stateDiagram-v2
    [*] --> Landing: Initial Load
    Landing --> Setup: User Login / Project Select
    Landing --> Setup: Create New Project
    Setup --> Workspace: Load / Launch Project
    Workspace --> Setup: Projects Button
    Workspace --> Admin: Admin Link (if admin role)
    Admin --> Setup: Back to Projects
```

### Key User Journey Flows

#### Flow 1: Guest User → Brainstorm → Launch
```
Landing → Setup (handleCreateNewProject)
    ↓
NeuralStreamChat (brainstorming)
    ↓
Generate Preview (projectPreview)
    ↓
Launch Project (handleLaunchFromBrainstorming)
    ↓
Workspace (viewMode = 'workspace')
```

#### Flow 2: Authenticated User → Load Project
```

    ↓
Hub (automatic redirect)
    ↓

    ↓
Workspace (+ URL hash update)
```

```

    ↓
Validate Project ID (isValidObjectId)
    ↓
Fetch from DB/Storage
    ↓
dispatch(RESET_PROJECT)
    ↓
Workspace View
```

### Identified User Journey Issues

#### Issue 1: Hash Sync Race Conditions
**Location:** [useViewMode.ts](file:///Users/omarabdelmaksoud/OrbitAI/ORBITAI-Clean/client/src/hooks/useViewMode.ts)

| Problem | Description | Impact |
|---------|-------------|--------|
| Duplicate Hash Updates | Both [useViewMode](file:///Users/omarabdelmaksoud/OrbitAI/ORBITAI-Clean/client/src/hooks/useViewMode.ts#5-128) hook and [App.tsx](file:///Users/omarabdelmaksoud/OrbitAI/ORBITAI-Clean/client/src/App.tsx) handle `hashchange` events | Potential double-navigation |
| Flag Timing | `isProgrammaticHashChangeRef` may not sync correctly | View mode flickering |
| No Hash Debounce | Rapid hash changes can trigger multiple transitions | UI instability |

**Evidence (useViewMode.ts:86-117):**
```typescript
// Both App.tsx and useViewMode.ts listen for hashchange
window.addEventListener('hashchange', handleHashChange);
```

**Recommendation:** Centralize hash handling in a single hook with debounce.

```bash
# Clone and install
cd OrbitAI/ORBITAI-Clean
npm install

# Configure environment
cp server/.env.example server/.env
# Edit .env with MongoDB URI, API keys, etc.
```

### Running the Application

```bash
# Terminal 1: Backend
npm run dev --workspace=server

# Terminal 2: Frontend
npm run dev --workspace=client
# → http://localhost:5173

# Or run both concurrently
npm run dev
